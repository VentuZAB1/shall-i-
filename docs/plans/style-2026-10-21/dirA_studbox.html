<!doctype html>
<html><head><meta charset="utf-8"><title>SLINGSHOT style A - STUDBOX</title>
<style>
@font-face{font-family:GB;src:url("assets/fonts/Montserrat-Black.ttf")}   /* stand-in for GothamBlack */
@font-face{font-family:LG;src:url("assets/fonts/LuckiestGuy-Regular.ttf")}
:root{
  --ink:#14162A;
  /* baseplate */
  --plate-top:#33427C; --plate-bot:#27315F; --plate-side:#181E3F; --plate-rim:#5466A8;
  --recess:#1A2147;
  /* studs that work on ANY colour: light disc + dark crescent */
  --studs: radial-gradient(circle at 9px 9px, rgba(255,255,255,.17) 0 4px, transparent 4.6px),
           radial-gradient(circle at 10.3px 10.3px, rgba(0,0,0,.15) 0 4.7px, transparent 5.3px);
  --studs-plate: radial-gradient(circle at 9.4px 9.4px, rgba(255,255,255,.07) 0 4.2px, transparent 4.8px),
           radial-gradient(circle at 11px 11px, rgba(0,0,0,.20) 0 4.9px, transparent 5.5px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden}
.stage{position:relative;overflow:hidden;background-size:cover;background-position:left top}
.stage-dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(8,10,25,.30),rgba(8,10,25,.12) 70%)}
.guide-safe{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.28) 0 6px,rgba(0,0,0,.12) 6px 12px)}
.win{position:absolute;transform-origin:50% 50%}
.abs{position:absolute}
.txt{position:absolute;white-space:nowrap;color:#fff;text-align:center;line-height:1}
.gb{font-family:GB}.lg{font-family:LG;letter-spacing:.5px}
.s2{-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.s25{-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.s3{-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
.stk{position:absolute;filter:drop-shadow(0 3px 0 rgba(12,14,34,.5))}

/* ---------- BRICK = holder{Side, Face}: the side is the brick's 3D wall, both outlined in ink ---------- */
.brick{position:absolute}
.brick>.side,.brick>.inner>.side{position:absolute;left:0;right:0;bottom:0;top:var(--d);border-radius:var(--r);background:var(--cs);
  box-shadow:0 0 0 var(--ol) var(--ink)}
.brick>.face,.brick>.inner>.face{position:absolute;left:0;right:0;top:0;bottom:var(--d);border-radius:var(--r);overflow:hidden;
  background:var(--studs),linear-gradient(180deg,var(--ct) 0%,var(--c) 70%);background-size:18px 18px,100% 100%;
  box-shadow:0 0 0 var(--ol) var(--ink),inset 0 2px 0 var(--hl),inset 0 -2px 0 rgba(0,0,0,.14)}
.brick>.inner{position:absolute;inset:0}

/* window = studded baseplate */
.win>.side{position:absolute;left:0;right:0;top:7px;bottom:0;border-radius:14px;background:var(--plate-side);box-shadow:0 0 0 3.5px var(--ink)}
.win>.face{position:absolute;left:0;right:0;top:0;height:463px;border-radius:14px;overflow:hidden;
  background:var(--studs-plate),linear-gradient(180deg,var(--plate-top),var(--plate-bot));background-size:20px 20px,100% 100%;
  box-shadow:0 0 0 3.5px var(--ink),inset 0 2px 0 var(--plate-rim)}

/* palettes: c = face, ct = top tint, cs = side, hl = rim highlight */
.p-lime{--c:#62C91C;--ct:#8EE83A;--cs:#2F7A0C;--hl:#CBFF8E}
.p-pumpkin{--c:#F2700F;--ct:#FF9A2E;--cs:#9A3C04;--hl:#FFD08A}
.p-red{--c:#E8243A;--ct:#FF5468;--cs:#7E0A18;--hl:#FFB0BC}
.p-slate{--c:#34406E;--ct:#3D4A7E;--cs:#1E2650;--hl:#5C6BA8}
.p-silver{--c:#A9B2C8;--ct:#D3DAE8;--cs:#5D667E;--hl:#FFFFFF}
.p-off{--c:#2A3158;--ct:#323A66;--cs:#161B38;--hl:#4B5590}
.p-gold{--c:#F5A800;--ct:#FFD23A;--cs:#94600A;--hl:#FFF0A8}
/* the 6 areas */
.a-grass{--c:#43B91F;--ct:#6FDA43;--cs:#22700C;--hl:#C4FF9E}
.a-water{--c:#1987EA;--ct:#45AEFF;--cs:#0B4C93;--hl:#AEDDFF}
.a-thunder{--c:#E9AA00;--ct:#FFD21C;--cs:#8E6200;--hl:#FFF3A6}
.a-fire{--c:#E5501A;--ct:#FF7E3E;--cs:#8C2C08;--hl:#FFC4A0}
.a-shadow{--c:#7C34E0;--ct:#9E5CFF;--cs:#461889;--hl:#DCC2FF}
.a-celestial{--c:#3445C6;--ct:#5468EA;--cs:#1C2475;--hl:#BFC9FF}
.a-celestial>.inner>.face{background:radial-gradient(circle at 22px 30px,#FFE48A 0 1.6px,transparent 2.2px),radial-gradient(circle at 120px 18px,#FFE48A 0 1.4px,transparent 2px),
  radial-gradient(circle at 136px 70px,#fff 0 1.2px,transparent 1.8px),radial-gradient(circle at 14px 96px,#fff 0 1.2px,transparent 1.8px),
  var(--studs),linear-gradient(180deg,var(--ct),var(--c) 70%);background-size:auto,auto,auto,auto,18px 18px,100% 100%}
.prism{--c:#3A2A8E;--ct:#3A2A8E;--cs:#1A1446;--hl:rgba(255,255,255,.35)}
.prism>.inner>.face{background:var(--studs),radial-gradient(ellipse at 50% 38%,#6A4BE0 0%,#3A2A8E 45%,#1E1850 85%);
  background-size:18px 18px,100% 100%}
.prismrim{position:absolute;inset:0;border-radius:inherit;padding:5px;pointer-events:none;
  background:linear-gradient(140deg,#FF2E63 0%,#FF8A00 17%,#FFD000 33%,#33D14A 50%,#00B7FF 67%,#5B4BFF 83%,#D400E0 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* ---------- header ---------- */
.title{font-family:LG;font-size:29px;letter-spacing:1px}
.title-shadow{color:var(--ink);-webkit-text-stroke:6px var(--ink)}

/* ---------- tabs ---------- */
.tab .label{font-family:LG;font-size:20px;letter-spacing:.5px}
.tab.off>.inner>.face{top:var(--d);bottom:0;box-shadow:0 0 0 var(--ol) var(--ink),inset 0 3px 0 rgba(0,0,0,.28)}
.tab.off>.inner>.side{display:none}
.tab.off .label{color:#AEB9E6}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FF6A74,#E0102A 70%);box-shadow:0 0 0 2px var(--ink)}
.dot span{position:absolute;inset:0;font-family:GB;font-size:15px;line-height:20px;text-align:center;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}

/* ---------- streak plate (recessed) ---------- */
.recess{position:absolute;border-radius:10px;background:linear-gradient(180deg,#141A3C,#1D2550);box-shadow:0 0 0 2px var(--ink),inset 0 3px 0 rgba(0,0,0,.35),inset 0 -1.5px 0 rgba(120,140,220,.35)}
.stud{position:absolute;width:24px;height:24px;border-radius:50%}
.stud.done{background:radial-gradient(circle at 38% 34%,#C8FF8A 0 3px,#7EE02C 4px,#3E9A0E 100%);box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 rgba(0,0,0,.25)}
.stud.today{background:radial-gradient(circle at 38% 34%,#FFF7C0 0 3px,#FFD21C 5px,#E08A00 100%);box-shadow:0 0 0 2px var(--ink),0 0 0 5px rgba(255,214,40,.45),inset 0 -3px 0 rgba(0,0,0,.2)}
.stud.lock{background:radial-gradient(circle at 38% 34%,#4A5590 0 2px,#2C3566 4px,#1C2248 100%);box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 rgba(0,0,0,.35)}
.stud.hero{background:conic-gradient(from 20deg,#FF2E63,#FF8A00,#FFD000,#33D14A,#00B7FF,#5B4BFF,#D400E0,#FF2E63);box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 rgba(0,0,0,.25)}
.track{position:absolute;height:6px;border-radius:3px;background:#0E1230;box-shadow:0 0 0 1.5px var(--ink)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(180deg,#A6F25A,#55B91A)}

/* ---------- cards ---------- */
.card .day{font-family:GB;font-size:16px}
.card .val{font-family:LG;font-size:22px;letter-spacing:.5px}
.card .sub{font-family:GB;font-size:16px;color:#FFFFFF}
.btn .label{font-family:LG;font-size:19px;letter-spacing:.5px}
.st-claimed>.inner{filter:brightness(.6) saturate(.7)}
.st-locked>.inner{filter:brightness(.45) saturate(.6)}
.st-tomorrow>.inner{filter:brightness(.82)}
.hero.st-locked>.inner{filter:brightness(.92)}   /* the carrot never goes dark */
.ring{position:absolute;inset:0;border-radius:var(--r);box-shadow:inset 0 0 0 3px #FFFFFF,inset 0 0 16px 5px rgba(255,255,255,.55)}
.chip{position:absolute;border-radius:9px;background:rgba(14,16,40,.55);box-shadow:0 0 0 2px var(--ink),inset 0 1.5px 0 rgba(255,255,255,.18)}
.chip .txt{font-family:GB;font-size:16px}
.ribbon{position:absolute;border-radius:6px;background:linear-gradient(180deg,#FF5468,#D9142E);box-shadow:0 0 0 2px var(--ink),inset 0 1.5px 0 #FFB0BC}
.ribbon .txt{font-family:LG;font-size:16px;letter-spacing:.5px}
.timer .txt{font-family:GB}
.note{position:absolute;font-family:'Segoe UI',sans-serif;font-weight:600;font-size:12px;color:#c9cde0;line-height:1.25}
#qa{position:absolute;left:8px;top:8px;background:#000c;color:#0f0;font:12px monospace;padding:6px;z-index:99;white-space:pre}
</style></head>
<body>
<script src="common.js"></script>
<script>
function pos(e, x, y, w, hh) { Object.assign(e.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: hh + 'px' }); return e; }
function brick(parent, cls, x, y, w, hh, d, r, ol, name, tile) {
  const b = h('div', 'brick ' + cls, parent, { data: { ol: ol, name: name } });
  if (tile) b.dataset.tile = tile;
  pos(b, x, y, w, hh);
  b.style.setProperty('--d', d + 'px'); b.style.setProperty('--r', r + 'px'); b.style.setProperty('--ol', ol + 'px');
  const inner = h('div', 'inner', b);
  h('div', 'side', inner);
  const face = h('div', 'face', inner, { data: { c: '1', name: name + '.face' } });
  return { b, face, inner };
}
function txt(parent, cls, s, x, y, w, size) {
  const t = h('div', 'txt ' + cls, parent, { textContent: s });
  pos(t, x, y, w, size + 2);
  t.style.lineHeight = (size + 2) + 'px';
  if (size) t.style.fontSize = size + 'px';
  return t;
}
const PUMPKIN = `<svg width="34" height="34" viewBox="0 0 30 30"><path d="M15 5c1-3 3-3.6 4.6-3.2l-.8 2.4c-1-.2-2 .3-2.4 1.6z" fill="#3E7A1A" stroke="#14162A" stroke-width="1.6"/><ellipse cx="9.5" cy="17" rx="7.5" ry="9" fill="#FF8A1E" stroke="#14162A" stroke-width="2"/><ellipse cx="20.5" cy="17" rx="7.5" ry="9" fill="#FF8A1E" stroke="#14162A" stroke-width="2"/><ellipse cx="15" cy="17" rx="7" ry="10" fill="#FFA43A" stroke="#14162A" stroke-width="2"/><path d="M10 15l2.6-2.6 1.4 3zM20 15l-2.6-2.6-1.4 3zM10 20.5q5 4 10 0l-1.6 2.2-1.6-1.2-1.8 1.4-1.8-1.4-1.6 1.2z" fill="#14162A"/></svg>`;

// generic button brick: palette, label, optional icon on the left
function button(parent, pal, label, x, y, w, hh, opts) {
  opts = opts || {};
  const d = opts.d || 3;
  const B = brick(parent, 'btn ' + pal, x, y, w, hh, d, opts.r || 7, 2.5, opts.name || ('btn_' + label));
  const face = B.inner.querySelector('.face'), side = B.inner.querySelector('.side');
  if (opts.pressed) { face.style.top = d + 'px'; face.style.bottom = '0px'; side.style.display = 'none'; }
  const size = opts.size || 19;
  const lab = txt(B.face, (opts.gb ? 'gb ' : 'label ') + 's25', label, 0, Math.round((hh - d - size) / 2) - 1, w, size);
  if (opts.color) lab.style.color = opts.color;
  if (opts.icon) {
    const is = opts.iconSize || 20;
    img(opts.icon, '', B.face, is, { position: 'absolute', left: (opts.iconX || 12) + 'px', top: Math.round((hh - d - is) / 2) + 'px' });
    lab.style.paddingLeft = (opts.pad || 26) + 'px';
  }
  return { B, lab };
}

// one small reward card (158 x 168)
const LABEL = { claim: 'CLAIM!', claimed: 'CLAIMED', tomorrow: TIMER, locked: 'LOCKED' };
const BTNPAL = { claim: 'p-lime', claimed: 'p-silver', tomorrow: 'p-off', locked: 'p-off' };
function buildCard(parent, day, state, x, y, tile) {
  const C = brick(parent, 'card a-' + day.area + ' st-' + state, x, y, 158, 168, 5, 11, 2.5, 'card' + day.d + state, tile);
  C.b.dataset.c = '1';
  const f = C.face;
  txt(f, 'day s25', 'DAY ' + day.d, 0, 5, 158, 16);
  const g = h('div', 'abs', f, { data: { ol: 0, name: 'icons' + day.d, c: '1' } }); pos(g, 9, 21, 140, 68);
  for (const [src, size, dx, dy, badge] of day.icons) {
    const k = 1.1, sz = Math.round(size * k);
    const im = img(src, 'stk', g, sz); im.style.left = (70 - sz / 2 + dx * k) + 'px'; im.style.top = (33 - sz / 2 + dy * 0.8) + 'px';
    if (badge) { const b = txt(g, 'gb s25', badge, Math.min(140 - 28, 70 + dx * k + sz / 2 - 20), 68 - 21, 26, 16); b.dataset.ol = 2.5; b.dataset.name = 'badge' + day.d; }
  }
  txt(f, 'val s3', day.val, 4, 89, 150, 21).style.fontSize = '22px';
  txt(f, 'sub s25', day.sub, 4, 111, 150, 16);
  const { lab } = button(f, BTNPAL[state], LABEL[state], 8, 131, 142, 28, { name: 'btn' + day.d });
  if (state === 'tomorrow') {
    lab.className = 'txt gb s25'; lab.style.fontSize = '17px'; lab.style.color = '#B8FF6A'; lab.style.paddingLeft = '22px';
    img('clock', '', lab.parentElement, 18, { position: 'absolute', left: '22px', top: '3px' });
  }
  if (state === 'locked') lab.style.color = '#AEB9E6';
  // state badges live OUTSIDE the dimmed layer, so they stay bright
  if (state === 'claim') { const r = h('div', 'ring', C.b); r.style.bottom = '5px'; }
  if (state === 'claimed') { const ck = img('check', 'stk', C.b, 58, { left: '50px', top: '24px', transform: 'rotate(-8deg)' }); ck.dataset.ol = 0; ck.dataset.name = 'check' + day.d; }
  if (state === 'locked') { const lk = img('lock', 'stk', C.b, 24, { right: '8px', top: '6px' }); lk.dataset.ol = 0; lk.dataset.name = 'lock' + day.d; }
  return C;
}

function streakPlate(parent, x, y, done, today, tile) {
  const R = h('div', 'recess', parent, { data: { ol: 2, name: 'streak', c: '1' } }); pos(R, x, y, 400, 38);
  if (tile) R.dataset.tile = tile;
  txt(R, 'gb s2', 'STREAK', 10, 10, 78, 16);
  const x0 = 96, step = 36;
  const tr = h('div', 'track', R); pos(tr, x0 + 12, 16, step * 6, 6);
  const fl = h('div', 'fill', tr); fl.style.width = (Math.max(0, (today || done) - 1) * step) + 'px';
  for (let i = 1; i <= 7; i++) {
    const cls = i === 7 ? 'hero' : i <= done ? 'done' : i === today ? 'today' : 'lock';
    const s = h('div', 'stud ' + cls, R, { data: { ol: i === today ? 5 : 2, name: 'stud' + i } });
    pos(s, x0 + (i - 1) * step, 7, 24, 24);
    if (i === 7) img('star', '', s, 14, { position: 'absolute', left: '5px', top: '5px' });
  }
  txt(R, 'lg s25', Math.max(done, today) + '/7', 340, 8, 50, 20);
  return R;
}

function buildWindow() {
  const { st, win } = stage();
  h('div', 'side', win);
  const F = h('div', 'face', win, { data: { c: '1', name: 'winface' } });
  // HEADER: a pumpkin-orange brick (Halloween skin of the lime Daily brick)
  const H = brick(F, 'p-pumpkin', 10, 10, 720, 44, 4, 10, 2.5, 'header');
  img('gift', 'stk', H.face, 36, { left: '8px', top: '2px' });
  const sh = txt(H.face, 'title title-shadow', 'DAILY REWARDS', 54, 11, 300, 26); sh.style.textAlign = 'left'; sh.style.fontSize = '29px';
  const t = txt(H.face, 'title s3', 'DAILY REWARDS', 54, 7, 300, 26); t.style.textAlign = 'left'; t.style.fontSize = '29px';
  const pk = h('div', 'stk', H.face, { innerHTML: PUMPKIN }); pos(pk, 288, 3, 34, 34);
  const X = brick(H.face, 'p-red', 682, 3, 34, 34, 4, 7, 2, 'close'); txt(X.face, 'lg s25', 'X', 0, 4, 34, 22);
  // ROW 2: tabs + streak plate
  const T1 = brick(F, 'tab p-lime', 10, 62, 140, 38, 4, 9, 2.5, 'tabDaily', 'row2'); txt(T1.face, 'label s25', 'DAILY', 0, 6, 140, 20);
  const T2 = brick(F, 'tab off p-slate', 158, 62, 160, 38, 4, 9, 2.5, 'tabPlaytime', 'row2'); txt(T2.face, 'label s25', 'PLAYTIME', 0, 6, 132, 20);
  const d = h('div', 'dot', T2.face, { data: { ol: 2, name: 'dot' } }); d.style.right = '5px'; d.style.top = '7px'; h('span', '', d, { textContent: '!' });
  streakPlate(F, 330, 62, STATE === 'mid' ? 2 : 3, STATE === 'mid' ? 3 : 0, 'row2');
  // GRID
  const COLX = [10, 176, 342], ROWY = [108, 284];
  DAYS.forEach((day, i) => buildCard(F, day, ST[i], COLX[i % 3], ROWY[Math.floor(i / 3)], 'grid'));
  // DAY 7 HERO: dark star-night interior, prism rim, gold rays behind the pet
  const state = ST[6];
  const C = brick(F, 'card hero prism st-' + state, 508, 108, 222, 344, 5, 12, 2.5, 'card7', 'grid');
  C.b.dataset.c = '1';
  const f = C.face;
  img('glow', '', f, 230, { position: 'absolute', left: '-4px', top: '22px', opacity: .55 });
  img('rays', '', f, 206, { position: 'absolute', left: '8px', top: '34px', opacity: .5, transform: 'rotate(12deg)', filter: 'sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.15)' });
  h('div', 'prismrim', f);
  const dl = txt(f, 'day s25', 'DAY 7', 10, 7, 70, 16); dl.style.textAlign = 'left';
  const rb = h('div', 'ribbon', f, { data: { ol: 2, name: 'ribbon' } }); pos(rb, 128, 6, 84, 22);
  txt(rb, 's25', 'SECRET!', 0, 2, 84, 16);
  const tt = txt(f, 'lg s3', 'SECRET PET!', 0, 34, 222, 28); tt.style.color = '#FFE45C';
  const pet = img('mantis', 'stk', f, 150, { left: '36px', top: '62px' }); pet.dataset.ol = 0; pet.dataset.name = 'pet';
  txt(f, 'gb s25', 'THORNBLADE MANTIS', 4, 212, 214, 16);
  txt(f, 'gb s25', '15K KG', 4, 232, 214, 16).style.color = '#FFE45C';
  const c1 = h('div', 'chip', f, { data: { ol: 2, name: 'chip1', tile: 'chips' } }); pos(c1, 10, 256, 98, 32);
  img('potion_gold', '', c1, 22, { position: 'absolute', left: '4px', top: '5px' });
  img('potion_green', '', c1, 22, { position: 'absolute', left: '15px', top: '5px' });
  img('potion_blue', '', c1, 22, { position: 'absolute', left: '26px', top: '5px' });
  txt(c1, '', 'x5', 50, 7, 44, 16);
  const c2 = h('div', 'chip', f, { data: { ol: 2, name: 'chip2', tile: 'chips' } }); pos(c2, 114, 256, 98, 32);
  img('cash', '', c2, 28, { position: 'absolute', left: '4px', top: '2px' });
  txt(c2, '', '$72K', 36, 7, 58, 16);
  if (state === 'claim') button(f, 'p-lime', 'CLAIM!', 10, 301, 202, 32, { name: 'btn7', d: 3, r: 8 });
  else button(f, 'p-off', 'IN 4 DAYS', 10, 301, 202, 32, { name: 'btn7', d: 3, r: 8, color: '#FFE45C', icon: 'lock', iconX: 44, pad: 26 });
  qa();
}

// ---------------- COMPONENT SHEET ----------------
function buildSheet() {
  const bd = sheetStage('STYLE A  -  STUDBOX', 'every brick = Face + Side (its 3D wall), ink outline, studs on every face; LuckiestGuy display + GothamBlack body (mockup font for GothamBlack: Montserrat Black)');
  note(bd, 'BUTTONS  (h 44, side 4, radius 8, outline 2.5, label LuckiestGuy 20)', 24, 74, 600);
  const row = (x, label, pal, o) => button(bd, pal, label, x, 94, 168, 44, Object.assign({ d: 4, r: 8, size: 20 }, o || {}));
  row(24, 'CLAIM!', 'p-lime'); note(bd, 'primary / claim', 24, 144);
  row(204, '49', 'p-gold', { icon: 'robux', iconX: 52, iconSize: 22, pad: 30 }); note(bd, 'purchase (gold + Robux)', 204, 144);
  row(384, 'NO THANKS', 'p-slate', { color: '#C9D3F5' }); note(bd, 'secondary', 384, 144);
  row(564, 'CLAIMED', 'p-silver'); note(bd, 'disabled / done', 564, 144);
  row(744, 'LOCKED', 'p-off', { color: '#AEB9E6', icon: 'lock', iconX: 26, pad: 24 }); note(bd, 'locked', 744, 144);
  row(924, '09:41:27', 'p-off', { gb: true, size: 18, color: '#B8FF6A', icon: 'clock', iconX: 18, pad: 26 }); note(bd, 'tomorrow / timer', 924, 144);
  const pr = button(bd, 'p-lime', 'GO', 1104, 94, 72, 44, { d: 4, r: 8, size: 20, pressed: true });
  note(bd, 'pressed: face sinks onto the side', 1100, 144, 90);
  note(bd, 'TABS / CLOSE / BADGES', 24, 182, 400);
