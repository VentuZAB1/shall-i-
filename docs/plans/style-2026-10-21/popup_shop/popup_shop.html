<!doctype html>
<html><head><meta charset="utf-8"><title>HATCH NIGHT - Starter Pack popup + Shop (planner mockups 2026-10-21)</title>
<style>
@font-face{font-family:GB;src:url("../assets/fonts/Montserrat-Black.ttf")}   /* stand-in for GothamBlack (engine is ~14% narrower) */
:root{
  --ink:#0D0B1C;
  --night-top:#2E2566; --night-bot:#1B1642; --night-side:#0F0B28;
  --card-top:#3A3082; --card-bot:#29215F; --card-side:#151032; --card-hl:#7062D8;
  --lav:#D2CAFF; --lav-dim:#A79FE0; --lime:#B8FF6A; --gold:#FFD23A; --red:#FF6E78;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden}
.stage{position:relative;overflow:hidden;background-size:cover;background-position:left top}
.stage-dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(8,6,25,.34),rgba(8,6,25,.14) 70%)}
.stage-modal{position:absolute;inset:0;background:rgba(8,6,25,.55)}
.guide-safe{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.28) 0 6px,rgba(0,0,0,.12) 6px 12px)}
.win{position:absolute;transform-origin:50% 50%}
.abs{position:absolute}
.txt{position:absolute;white-space:nowrap;color:#fff;text-align:center;line-height:1;font-family:GB}
.s15{-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.s2{-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.s25{-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.s3{-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
.gfill{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.win>.side{position:absolute;left:0;right:0;top:7px;bottom:0;border-radius:18px;background:var(--night-side);box-shadow:0 0 0 3.5px var(--ink)}
.win>.face{position:absolute;left:0;right:0;top:0;height:463px;border-radius:18px;overflow:hidden;
  background:radial-gradient(ellipse 60% 50% at 18% 0%,rgba(140,120,255,.22),transparent 70%),linear-gradient(180deg,var(--night-top),var(--night-bot));
  box-shadow:0 0 0 3.5px var(--ink),inset 0 0 0 1.5px rgba(97,83,194,.55)}
.hdr{position:absolute;left:0;top:0;width:740px;height:46px}
.hdr-gloss{position:absolute;left:0;top:0;width:740px;height:20px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0))}
.tooth{position:absolute;transform:rotate(45deg)}
.gb{position:absolute}
.gb>.side{position:absolute;left:0;right:0;bottom:0;top:var(--d);border-radius:var(--r);background:var(--cs);box-shadow:0 0 0 var(--ol) var(--ink)}
.gb>.face{position:absolute;left:0;right:0;top:0;bottom:var(--d);border-radius:var(--r);overflow:hidden;
  background:linear-gradient(180deg,var(--ct),var(--c));box-shadow:0 0 0 var(--ol) var(--ink),inset 0 1.5px 0 var(--hl)}
.gb>.face::after{content:"";position:absolute;left:3px;right:3px;top:2px;height:42%;border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 40% 40%/calc(var(--r) - 2px) calc(var(--r) - 2px) 6px 6px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.08))}
.p-lime{--c:#4FCB10;--ct:#B4FF4A;--cs:#2A7608;--hl:#E8FFB4}
.p-red{--c:#E01A34;--ct:#FF5A6E;--cs:#7A0816;--hl:#FFB8C2}
.p-silver{--c:#9F98C8;--ct:#DEDAF4;--cs:#575184;--hl:#FFFFFF}
.p-off{--c:#352D6C;--ct:#463E88;--cs:#1B1640;--hl:#6A60B8}
.p-gold{--c:#F59A00;--ct:#FFE070;--cs:#8E5600;--hl:#FFF3B0}
.p-dusk{--c:#2C2560;--ct:#3A3280;--cs:#161236;--hl:#6A60B8}
.p-violet{--c:#9632DC;--ct:#D680FF;--cs:#501482;--hl:#F0C8FF}
.recess{position:absolute;background:linear-gradient(180deg,#120E30,#1C1746);box-shadow:0 0 0 2px var(--ink),inset 0 3px 0 rgba(0,0,0,.4),inset 0 -1.5px 0 rgba(140,125,255,.35)}
.chip{position:absolute;border-radius:14px;background:rgba(8,6,24,.6);box-shadow:0 0 0 2px var(--ink),inset 0 1.5px 0 rgba(255,255,255,.14)}
.tag{position:absolute;border-radius:8px;background:linear-gradient(180deg,#FF5A6E,#D9142E);box-shadow:0 0 0 2px var(--ink),inset 0 1.5px 0 #FFB8C2}
.card{position:absolute}
.card>.side{position:absolute;left:0;right:0;bottom:0;top:5px;border-radius:14px;background:var(--card-side);box-shadow:0 0 0 2.5px var(--ink)}
.card>.face{position:absolute;left:0;right:0;top:0;bottom:5px;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,var(--card-top),var(--card-bot));box-shadow:0 0 0 2.5px var(--ink),inset 0 1.5px 0 var(--card-hl)}
.clip{position:absolute;overflow:hidden}
.note{position:absolute;font-family:'Segoe UI',sans-serif;font-weight:600;font-size:12px;color:#c9cde0;line-height:1.25}
#qa{position:absolute;left:8px;top:8px;background:#000c;color:#0f0;font:12px monospace;padding:6px;z-index:99;white-space:pre}
</style></head>
<body>
<script src="engine.js"></script>
<script>
// =====================================================================================================================
// Copy + data (stand-ins: the Magma egg = egg.png tinted, Ivonrath = Storm Wyvern portrait, Inferno Phoenix secret =
// Black Dragon silhouette, the treadmill icon = a drawn chevron). Numbers = the plan's geometry tables.
// =====================================================================================================================
const GOLD_G = 'linear-gradient(180deg,#FFF078 0%,#FFAA00 100%)';
const RED_G = 'linear-gradient(180deg,#FFEBE1 0%,#FF3C32 100%)';
const ODDS = [['MoltenBoar', '41.1%'], ['LavaGolem', '29.4%'], ['Cerberus', '18.4%'], ['StormWyvern', '7%'], ['BlackDragon', '4.1%', true]];
const EGG_FILTER = 'sepia(1) saturate(7) hue-rotate(-28deg) brightness(.92) contrast(1.15)';

// ---------------------------------------------------------------- the STARTER PACK popup
function popup(mode) { // mode: normal | restricted | thanks | error | urgent
  const { F } = stage();
  const R = mode === 'restricted';
  const canvas = h('div', 'abs', F, { data: { c: '1', name: 'Canvas' } }); pos(canvas, 0, 0, 740, 463);
  // hero art (frameless, on the canvas): rays + glow, potions/cash BEHIND the egg, the egg on top with an ink twin
  const dy = R ? 24 : 0; // restricted: the hero group sits 24 lower (centred on the two rows)
  const rays = img('A:rays', canvas, 45, 90 + dy, 220, 220, { opacity: .5, filter: 'sepia(1) saturate(5) hue-rotate(275deg) brightness(1.15)' });
  rays.dataset.ol = 0; rays.dataset.name = 'Rays';
  glow(canvas, 30, 100 + dy, 250, 200, R ? '#6CFF5A' : '#FF8C32', .35);
  sticker('A:potion_blue', canvas, 52, 120 + dy, 54, -12, 'PotionSpeed');
  sticker('A:potion_gold', canvas, 64, 212 + dy, 60, -16, 'PotionMoney');
  sticker('A:potion_green', canvas, 186, 212 + dy, 60, 16, 'PotionHatch');
  if (!R) sticker('A:cash', canvas, 188, 106, 68, 12, 'Cash');
  const heroSrc = R ? 'A:cash' : 'A:egg';
  const ol = img(heroSrc, canvas, 71, 112 + dy, 168, 168, { filter: 'brightness(0)' }); ol.dataset.ol = 0; ol.dataset.name = 'HeroOutline';
  const hero = img(heroSrc, canvas, 75, 116 + dy, 160, 160, R ? {} : { filter: EGG_FILTER }); hero.dataset.ol = 0; hero.dataset.name = 'Hero';
  const urgent = mode === 'urgent';
  gradTxt(canvas, urgent ? 'ENDS IN 42:17' : 'ENDS IN 23:59:48', 10, 70, 290, 22, urgent ? RED_G : GOLD_G, { name: 'EndsIn' });
  // reward rows
  const rows = R ? [['A:potion_purple', '10x EVERY POTION', 'MONEY + HATCH + SPEED', 'var(--lav)', 16],
                    ['A:cash', '1 HOUR OF INCOME', '+$36K', 'var(--lime)', 20]]
                 : [['A:egg', 'BIG MAGMA EGG', '10K KG - A RANDOM PET!', 'var(--gold)', 16],
                    ['A:potion_purple', '5x EVERY POTION', 'MONEY + HATCH + SPEED', 'var(--lav)', 16],
                    ['A:cash', '1 HOUR OF INCOME', '+$36K', 'var(--lime)', 20]];
  const y0 = R ? 149 : 66;
  rows.forEach(([ic, l1, l2, c2, s2], i) => {
    const r = chip(canvas, 318, y0 + i * 74, 412, 66, ['EggRow', 'PotionRow', 'CashRow'][R ? i + 1 : i], 'rows');
    const st = sticker(ic, r, 10, 8, 50, 0, 'RowIcon');
    if (ic === 'A:egg') st.style.filter += ' ' + EGG_FILTER;
    txt(r, l1, 70, 10, 332, 22, { align: 'left', name: 'Line1' });
    txt(r, l2, 70, s2 === 20 ? 36 : 38, 332, s2, { align: 'left', color: c2, name: 'Line2' });
  });
  // the egg's ODDS (paid random item rule: always on screen before the purchase)
  if (!R) {
    txt(canvas, 'EGG ODDS - HATCHES ONE OF THESE:', 10, 288, 720, 16, { color: 'var(--lav)', name: 'OddsCaption' });
    const od = recess(canvas, 10, 310, 720, 62, 20, 'Odds');
    const n = ODDS.length, cw = 720 / n;
    ODDS.forEach(([pet, pct, secret], i) => {
      const cell = h('div', 'abs', od, { data: { c: '1', name: 'Odds' + (i + 1) } }); pos(cell, i * cw, 0, cw, 62);
      const p = sticker('pet_' + pet, cell, 6, 4, 54, 0, 'Pet');
      if (secret) {
        p.style.filter = 'brightness(0) drop-shadow(0 3px 0 rgba(6,4,20,.55))';
        gradTxt(cell, '?', 6, 18, 54, 26, GOLD_G, { name: 'Secret' });
        gradTxt(cell, pct, 62, 21, 78, 20, GOLD_G, { stroke: 's25', align: 'left', name: 'Pct' });
      } else txt(cell, pct, 62, 21, 78, 20, { align: 'left', name: 'Pct' });
    });
  }
  // buttons (BUY = purchase gold + Robux; NO THANKS = dusk secondary)
  if (mode === 'thanks') {
    button(canvas, 'silver', 'NO THANKS', 10, 384, 212, 60, { d: 4, r: 12, size: 20, name: 'NoThanks', tile: 'btns' }).b.style.opacity = 0; // hidden
    button(canvas, 'lime', 'OWNED!', 238, 384, 492, 60, { d: 4, r: 12, size: 32, name: 'Buy', tile: 'btns' });
  } else {
    button(canvas, 'dusk', 'NO THANKS', 10, 384, 212, 60, { d: 4, r: 12, size: 20, color: 'var(--lav)', name: 'NoThanks', tile: 'btns' });
    if (mode === 'error') button(canvas, 'red', 'TRY AGAIN', 238, 384, 492, 60, { d: 4, r: 12, size: 32, name: 'Buy', tile: 'btns' });
    else button(canvas, 'gold', '49', 238, 384, 492, 60, { d: 4, r: 12, size: 32, robux: true, glyph: 34, pre: 'BUY', name: 'Buy', tile: 'btns' });
  }
  chrome(F, 'Shop', mode === 'thanks' ? 'THANK YOU!' : 'STARTER PACK!', 'A:star');
  qa();
}

// ---------------------------------------------------------------- the SHOP
const SECTIONS = [
  { key: 'PASSES', tab: 'FEATURED', icon: 'A:star', color: '#FFD63C' },
  { key: 'SPEED', tab: 'SPEED', icon: 'A:shoe', color: '#5ADCFF' },
  { key: 'POTIONS', tab: 'POTIONS', icon: 'A:potion_purple', color: '#CD82FF' },
  { key: 'TREADMILL', tab: 'TREADMILL', icon: 'TREAD', color: '#FF9646' },
  { key: 'EGGS', tab: 'EGGS', icon: 'A:egg', color: '#78FF78' },
];
const PASSES = [
  { key: 'Growth2x', icon: 'pass_growth', glow: '#FF78C8', title: 'x2 GROWTH', l1: 'EGGS HATCH', l2: 'x2 FASTER!', price: '75', owned: true },
  { key: 'Money2x', icon: 'pass_money', glow: '#FFE25A', title: 'x2 MONEY', l1: 'PETS EARN', l2: 'x2 MONEY!', price: '100' },
  { key: 'VIP', icon: 'pass_vip', glow: '#BE6EFF', title: 'VIP', l1: 'VIP ROOMS', l2: '+ VIP TAG!', price: '63' },
  { key: 'Speed2x', icon: 'A:shoe', glow: '#5ADCFF', title: 'x2 SPEED', l1: 'x2 SPEED ON', l2: 'TREADMILLS!', price: '88' },
];
// the list layout (logical, inside List = (4, 4) of the scroll canvas, 576 wide); starter = the Starter Pack slot is shown
function layout(starter) {
  let y = 0; const L = {};
  if (starter) { L.starter = 0; y = 142; }
  L.PASSES = y; L.passRow1 = y + 36; L.passRow2 = y + 36 + 158; y += 36 + 150 + 8 + 150 + 18;
  L.SPEED = y; L.double = y + 36; L.boosts = y + 36 + 124 + 8; y += 36 + 124 + 8 + 176 + 18;
  L.POTIONS = y; L.potRow1 = y + 36; L.potRow2 = y + 36 + 184; y += 36 + 176 + 8 + 176 + 18;
  L.TREADMILL = y; L.tread = y + 36; y += 36 + 124 + 18;
  L.EGGS = y; L.eggs = y + 36; y += 36 + 124 + 8;
  L.H = y; L.canvas = y + 8; // CanvasSize = List top 4 + H + 4
  return L;
}
function treadIcon(parent, x, y, size) { // stand-in for the treadmill tile icon (green double chevron)
  const s = h('div', 'abs', parent, { data: { ol: 0, name: 'TreadIcon' } }); pos(s, x, y, size, size);
  s.innerHTML = `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="filter:drop-shadow(0 3px 0 rgba(6,4,20,.55))">
    <path d="M50 8 L88 44 L70 44 L50 26 L30 44 L12 44 Z" fill="#7CF05A" stroke="#0D0B1C" stroke-width="5" stroke-linejoin="round"/>
    <path d="M50 44 L88 80 L70 80 L50 62 L30 80 L12 80 Z" fill="#3FB82C" stroke="#0D0B1C" stroke-width="5" stroke-linejoin="round"/></svg>`;
  return s;
}
function sectionHeader(list, s, y) {
  const r = h('div', 'abs', list, { data: { c: '1', name: 'Header_' + s.key } }); pos(r, 0, y, 576, 30);
  if (s.icon === 'TREAD') treadIcon(r, 0, 2, 26); else sticker(s.icon, r, 0, 2, 26, 0, 'HeaderIcon');
  txt(r, s.key, 34, 5, 200, 20, { align: 'left', color: s.color, name: 'Title' });
  const tw = measure(s.key, 20);
  const line = h('div', 'abs', r); pos(line, 34 + tw + 12, 14, 576 - 34 - tw - 12, 2);
  line.style.background = 'rgba(140,125,255,.35)'; line.style.borderRadius = '1px';
}
function priceBtn(face, x, y, w, hh, price, o) {
  o = o || {};
  return button(face, o.pal || 'gold', price, x, y, w, hh, Object.assign({ d: 4, r: 10, size: o.size || 24, robux: !o.plain, glyph: o.glyph }, o));
}
function shopList(outer, L, opt) {
  opt = opt || {};
  const list = h('div', 'abs', outer); pos(list, 4, 4, 576, L.H); // content origin (4, 4): every outline stays inside List
  // STARTER PACK card (built by StarterPackClient into the slot)
  if (L.starter !== undefined) {
    const f = card(list, 0, L.starter, 576, 128, 'StarterSlot', { face: 'linear-gradient(180deg,#6E2496,#3C1868)' });
    const ring = h('div', 'abs', f); pos(ring, 3, 3, 570, 117); ring.style.borderRadius = '11px'; ring.style.boxShadow = 'inset 0 0 0 3px #FFD65A';
    const rays = img('A:rays', f, 12, 2, 118, 118, { opacity: .45, filter: 'sepia(1) saturate(5) hue-rotate(275deg) brightness(1.15)' }); rays.dataset.ol = 0;
    glow(f, 14, 6, 116, 108, '#FF8C32', .4);
    sticker('A:potion_gold', f, 8, 72, 36, -14, 'PotionMoney');
    sticker('A:potion_green', f, 100, 72, 36, 14, 'PotionHatch');
    sticker('A:cash', f, 96, 10, 40, 10, 'Cash');
    const eo = img('A:egg', f, 26, 14, 88, 88, { filter: 'brightness(0)' }); eo.dataset.ol = 0;
    const e = img('A:egg', f, 28, 16, 84, 84, { filter: EGG_FILTER }); e.dataset.ol = 0; e.dataset.name = 'Egg';
    txt(f, 'STARTER PACK', 148, 12, 240, 24, { align: 'left', name: 'Title' });
    txt(f, '5x EVERY POTION', 148, 44, 240, 16, { align: 'left', name: 'Line1' });
    txt(f, '+ 1 HOUR OF INCOME', 148, 64, 240, 16, { align: 'left', color: 'var(--lav)', name: 'Line2' });
    txt(f, '+ BIG MAGMA EGG!', 148, 84, 240, 16, { align: 'left', color: 'var(--gold)', name: 'Line3' });
    priceBtn(f, 404, 20, 160, 56, '49', { size: 28, glyph: 30, r: 12, name: 'StarterBuy' });
    gradTxt(f, '23:59:48 LEFT', 404, 86, 160, 16, GOLD_G, { stroke: 's25', name: 'Timer' });
  }
  // PASSES
  sectionHeader(list, SECTIONS[0], L.PASSES);
  PASSES.forEach((p, i) => {
    const f = card(list, (i % 2) * 292, i < 2 ? L.passRow1 : L.passRow2, 284, 150, 'Pass_' + p.key, { tile: 'passes' });
    glow(f, 6, 6, 104, 96, p.glow, .45);
    sticker(p.icon, f, 14, 12, 84, 0, 'Icon');
    txt(f, p.title, 106, 14, 170, 22, { align: 'left', name: 'Title' });
    txt(f, p.l1, 106, 44, 170, 16, { align: 'left', color: 'var(--lav)', name: 'Line1' });
    txt(f, p.l2, 106, 63, 170, 16, { align: 'left', color: 'var(--lav)', name: 'Line2' });
    const g = gbtn(f, 'violet', 10, 98, 54, 40, { d: 4, r: 10, name: 'Gift', tile: 'passbtn' });
    sticker('A:gift', g.face, 13, 4, 28, 0, 'GiftIcon');
    if (p.owned) button(f, 'silver', 'OWNED', 76, 98, 198, 40, { d: 4, r: 10, size: 20, name: 'Buy', tile: 'passbtn' });
    else priceBtn(f, 76, 98, 198, 40, p.price, { name: 'Buy', tile: 'passbtn' });
  });
  // SPEED: DOUBLE SPEED + the 3 boost cards (SpeedBoostCards.CARDS data)
  sectionHeader(list, SECTIONS[1], L.SPEED);
  {
    const f = card(list, 0, L.double, 576, 124, 'Double');
    glow(f, 8, 6, 132, 108, '#55C8FF', .45);
    sticker('A:shoe', f, 26, 14, 90, 0, 'Icon');
    txt(f, 'x2', 92, 78, 44, 24, { color: 'var(--gold)', name: 'Badge' });
    txt(f, 'DOUBLE SPEED', 142, 16, 250, 24, { align: 'left', name: 'Title' });
    txt(f, 'x4', 142, 48, 40, 22, { align: 'left', name: 'Now' });
    const ax = 142 + measure('x4', 22) * GE + 10;
    const ar = h('div', 'abs', f); ar.innerHTML = `<svg width="18" height="22" viewBox="0 0 18 22"><path d="M3 3 L14 11 L3 19" fill="none" stroke="#0D0B1C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 3 L14 11 L3 19" fill="none" stroke="#B8FF6A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    pos(ar, ax, 49, 18, 22);
    txt(f, 'x8', ax + 26, 48, 60, 22, { align: 'left', color: 'var(--lime)', name: 'Next' });
    txt(f, 'EVERY BUY DOUBLES IT!', 142, 82, 250, 16, { align: 'left', color: 'var(--lav)', name: 'Sub' });
    priceBtn(f, 404, 32, 160, 54, '10', { size: 28, glyph: 30, r: 12, name: 'Buy' });
  }
  const BOOSTS = [
    { key: 'Speed15m', glow: '#FF78DC', color: '#FF8CE6', title: '+90M', sub: '15 MIN OF SPEED', art: 'shoe', price: '10' },
    { key: 'Speed3', glow: '#6EC8FF', color: '#7DD2FF', title: '3 POTIONS', sub: 'x2 SPEED 30 MIN', art: 'potion', price: '25' },
    { key: 'Speed2h', glow: '#FFAA5A', color: '#FFB46E', title: '+720M', sub: '2 HRS OF SPEED', art: 'shoe', price: '50', best: true },
  ];
  BOOSTS.forEach((b, i) => {
    const f = card(list, i * 195, L.boosts, 186, 176, 'Boost_' + b.key, { tile: 'boosts' });
    glow(f, 38, 4, 110, 92, b.glow, .45);
    if (b.best) tag(f, 'BEST VALUE', 8, 6, 124, 'BestValue');
    if (b.art === 'shoe') { sticker('A:shoe', f, 54, 32, 56, 0, 'Art'); sticker('A:clock', f, 108, 60, 26, 0, 'Clock'); }
    else { sticker('A:potion_blue', f, 50, 32, 56, 0, 'Art'); txt(f, 'x3', 110, 48, 56, 26, { align: 'left', color: 'var(--gold)', name: 'Count' }); }
    txt(f, b.title, 6, 90, 174, 22, { color: b.color, name: 'Title' });
    txt(f, b.sub, 6, 114, 174, 16, { color: 'var(--lav)', name: 'Sub' });
    priceBtn(f, 10, 134, 166, 32, b.price, { size: 22, glyph: 22, d: 3, r: 10, name: 'Buy' });
  });
  // POTIONS: 6 packs, 3 per row
  sectionHeader(list, SECTIONS[2], L.POTIONS);
  const PACKS = [['Money', 3, '25'], ['Money', 10, '65'], ['Hatch', 3, '25'], ['Hatch', 10, '65'], ['Speed', 3, '25'], ['Speed', 10, '65']];
  const PCOL = { Money: ['A:potion_gold', '#FFD650', 'x2 CASH 30 MIN'], Hatch: ['A:potion_green', '#82EB6E', 'x2 HATCH 30 MIN'], Speed: ['A:potion_blue', '#6ECDFF', 'x2 SPEED 30 MIN'] };
  // order on screen: row 1 = the x3 packs, row 2 = the x10 packs (BEST VALUE)
  const order = [0, 2, 4, 1, 3, 5];
  order.forEach((k, i) => {
    const [kind, n, price] = PACKS[k];
    const [art, col, sub] = PCOL[kind];
    const f = card(list, (i % 3) * 195, i < 3 ? L.potRow1 : L.potRow2, 186, 176, 'Pack_' + kind + n, { tile: 'packs' });
    glow(f, 38, 4, 110, 92, col, .4);
    if (n >= 10) tag(f, 'BEST VALUE', 8, 6, 124, 'BestValue');
    sticker(art, f, 50, 32, 56, 0, 'Art');
    txt(f, 'x' + n, 110, 48, 64, 26, { align: 'left', color: 'var(--gold)', name: 'Count' });
    txt(f, kind.toUpperCase(), 6, 90, 174, 22, { color: col, name: 'Title' });
    txt(f, sub, 6, 114, 174, 16, { color: 'var(--lav)', name: 'Sub' });
    priceBtn(f, 10, 134, 166, 32, price, { size: 22, glyph: 22, d: 3, r: 10, name: 'Buy' });
  });
  // TREADMILL
  sectionHeader(list, SECTIONS[3], L.TREADMILL);
  {
    const f = card(list, 0, L.tread, 576, 124, 'Treadmill');
    glow(f, 8, 6, 132, 108, '#FF9646', .45);
    treadIcon(f, 26, 14, 90);
