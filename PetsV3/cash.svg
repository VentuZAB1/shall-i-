<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512">
  <defs>
    <linearGradient id="billTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f58a"/>
      <stop offset="1" stop-color="#5ccf3a"/>
    </linearGradient>
    <linearGradient id="billSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fae2a"/>
      <stop offset="1" stop-color="#23801c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="bandSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8961a"/>
      <stop offset="1" stop-color="#c06f0c"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="128" cy="212" rx="104" ry="16" fill="#000" opacity="0.18"/>
  <g stroke="#1B1F3A" stroke-width="9" stroke-linejoin="round">
    <!-- back stack (offset) -->
    <path d="M60 70 L214 52 L240 118 L86 140 Z" fill="url(#billTop)"/>
    <path d="M86 140 L240 118 L240 146 L86 170 Z" fill="url(#billSide)"/>
    <path d="M60 70 L86 140 L86 170 L60 100 Z" fill="#2e9423"/>
    <!-- front stack -->
    <path d="M18 104 L172 86 L198 152 L44 174 Z" fill="url(#billTop)"/>
    <path d="M44 174 L198 152 L198 188 L44 212 Z" fill="url(#billSide)"/>
    <path d="M18 104 L44 174 L44 212 L18 142 Z" fill="#2e9423"/>
  </g>
  <!-- page lines on the side of the front stack -->
  <g stroke="#1a6b15" stroke-width="3" opacity="0.7">
    <path d="M50 184 L194 163"/>
    <path d="M50 195 L194 174"/>
  </g>
  <!-- bill inner border + $ medallion on the front top -->
  <path d="M36 110 L164 95 L184 146 L56 164 Z" fill="none" stroke="#2c9a22" stroke-width="4" opacity="0.8"/>
  <!-- gold band across the front stack -->
  <g stroke="#1B1F3A" stroke-width="8" stroke-linejoin="round">
    <path d="M88 99 L122 95 L148 159 L112 164 Z" fill="url(#band)"/>
    <path d="M112 164 L148 159 L148 196 L112 201 Z" fill="url(#bandSide)"/>
  </g>
  <!-- $ sign on the band -->
  <text x="118" y="143" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="40" fill="#1B1F3A" text-anchor="middle" transform="skewX(-12) translate(28 0)">$</text>
  <!-- gloss streaks -->
  <path d="M34 112 L96 104" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
  <path d="M78 76 L150 68" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- sparkles -->
  <g fill="#fff" stroke="#1B1F3A" stroke-width="4" stroke-linejoin="round">
    <path d="M222 24 L228 40 L244 46 L228 52 L222 68 L216 52 L200 46 L216 40 Z"/>
    <path d="M30 52 L34 62 L44 66 L34 70 L30 80 L26 70 L16 66 L26 62 Z"/>
  </g>
</svg>
